<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messages — Private</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet"/>
  <style>
    :root{--rose:#f43f8e;--roseL:#ff8ec8;--plum:#1e0a18;--glass:rgba(255,255,255,.07);--glassB:rgba(255,180,210,.2);--gold:#e8b4d0;--green:#22c55e;--red:#ef4444}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'DM Sans',sans-serif;background:radial-gradient(ellipse at 50% 0%,rgba(244,63,142,.16) 0%,var(--plum) 65%);color:#fff;min-height:100vh}
    a{color:var(--roseL)}
    button,input{font:inherit}
    :focus-visible{outline:2px solid var(--roseL);outline-offset:3px}
    .hidden{display:none!important}
    .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
    .card{background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(244,63,142,.05));border:1px solid var(--glassB);backdrop-filter:blur(20px);border-radius:22px;padding:2.4rem 2.2rem;width:100%;max-width:400px}
    h1{font-family:'Playfair Display',serif;font-style:italic;font-size:1.7rem;background:linear-gradient(135deg,var(--roseL),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.4rem}
    .sub{font-size:.85rem;color:rgba(255,255,255,.6);margin-bottom:1.4rem}
    label{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.65);margin:.9rem 0 .35rem}
    input{width:100%;padding:.8rem 1rem;border-radius:12px;border:1px solid var(--glassB);background:rgba(255,255,255,.06);color:#fff}
    .btn{display:inline-block;border:0;cursor:pointer;border-radius:50px;padding:.75rem 1.6rem;font-weight:600;font-size:.88rem;color:#fff;background:linear-gradient(135deg,var(--rose),#c0176b)}
    .btn.block{width:100%;margin-top:1.3rem}
    .btn.ghost{background:transparent;border:1px solid var(--glassB);color:var(--roseL)}
    .btn.danger{background:transparent;border:1px solid rgba(239,68,68,.5);color:#fca5a5}
    .btn.sm{padding:.4rem .95rem;font-size:.78rem}
    .btn:disabled{opacity:.6;cursor:wait}
    .err{color:#fca5a5;font-size:.85rem;margin-top:.9rem;min-height:1.2em}
    header{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;max-width:960px;margin:0 auto;padding:1.6rem 1.2rem .6rem}
    header h1{margin:0}
    .who{font-size:.8rem;color:rgba(255,255,255,.6)}
    .bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
    main{max-width:960px;margin:0 auto;padding:0 1.2rem 3rem}
    .stats{display:flex;gap:.8rem;flex-wrap:wrap;margin:1rem 0}
    .stat{background:var(--glass);border:1px solid var(--glassB);border-radius:14px;padding:.7rem 1.1rem;font-size:.85rem}
    .stat b{font-size:1.3rem;display:block}
    .tabs{display:flex;gap:.5rem;margin:.4rem 0 1rem}
    .tab{background:transparent;border:1px solid var(--glassB);color:rgba(255,255,255,.75);border-radius:50px;padding:.4rem 1rem;cursor:pointer;font-size:.82rem}
    .tab[aria-pressed="true"]{background:rgba(244,63,142,.2);color:#fff;border-color:var(--rose)}
    .msg{background:var(--glass);border:1px solid var(--glassB);border-radius:16px;padding:1.1rem 1.3rem;margin-bottom:.8rem}
    .msg.unread{border-color:var(--rose);box-shadow:0 0 0 1px rgba(244,63,142,.25)}
    .msg-top{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:.5rem}
    .msg-name{font-weight:600}
    .msg-meta{font-size:.78rem;color:rgba(255,255,255,.55)}
    .msg-body{white-space:pre-wrap;word-break:break-word;font-size:.92rem;line-height:1.6;color:rgba(255,255,255,.88);margin:.5rem 0 .9rem}
    .msg-actions{display:flex;gap:.5rem;flex-wrap:wrap}
    .badge{font-size:.68rem;font-weight:700;letter-spacing:.06em;padding:.15rem .6rem;border-radius:20px;background:rgba(244,63,142,.2);color:var(--roseL);margin-left:.5rem}
    .empty{text-align:center;color:rgba(255,255,255,.55);padding:2.5rem 1rem}
  </style>
</head>
<body>

<div id="login-view" class="center">
  <form class="card" id="login-form" autocomplete="on">
    <h1>Private Admin</h1>
    <p class="sub">Sign in to read your contact messages.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required/>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required/>
    <button class="btn block" id="login-btn" type="submit">Sign in</button>
    <div class="err" id="login-err" role="alert"></div>
  </form>
</div>

<div id="app-view" class="hidden">
  <header>
    <div>
      <h1>Contact Messages</h1>
      <div class="who" id="who"></div>
    </div>
    <div class="bar">
      <button class="btn ghost sm" id="refresh-btn" type="button">Refresh</button>
      <button class="btn ghost sm" id="logout-btn" type="button">Sign out</button>
    </div>
  </header>
  <main>
    <div class="stats">
      <div class="stat"><b id="n-total">0</b>Total</div>
      <div class="stat"><b id="n-unread">0</b>Unread</div>
    </div>
    <div class="tabs" role="group" aria-label="Filter">
      <button class="tab" id="tab-all" type="button" aria-pressed="true">All</button>
      <button class="tab" id="tab-unread" type="button" aria-pressed="false">Unread</button>
    </div>
    <div id="list" aria-live="polite"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://oiztdngwarwhjbxtgsdx.supabase.co';
const SB_KEY = 'sb_publishable_gpIruorbcC0-VxG3bko_2Q_eU2FRWbN';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

const $ = id => document.getElementById(id);
let msgs = [];
let filter = 'all';

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(iso){
  if(!iso) return '';
  try { return new Date(iso).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}); } catch(e){ return ''; }
}

function show(loggedIn, email){
  $('login-view').classList.toggle('hidden', loggedIn);
  $('app-view').classList.toggle('hidden', !loggedIn);
  if(loggedIn) $('who').textContent = 'Signed in as ' + (email || '');
}

$('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('login-btn'), err = $('login-err');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Signing in…';
  const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  btn.disabled = false; btn.textContent = 'Sign in';
  if(error){ err.textContent = 'Incorrect email or password.'; return; }
  $('password').value = '';
  show(true, data.user.email);
  load();
});

$('logout-btn').addEventListener('click', async () => {
  await sb.auth.signOut();
  msgs = []; render(); show(false);
});
$('refresh-btn').addEventListener('click', load);
$('tab-all').addEventListener('click', () => setFilter('all'));
$('tab-unread').addEventListener('click', () => setFilter('unread'));

function setFilter(f){
  filter = f;
  $('tab-all').setAttribute('aria-pressed', f === 'all');
  $('tab-unread').setAttribute('aria-pressed', f === 'unread');
  render();
}

async function load(){
  const { data, error } = await sb.from('messages').select('*').order('created_at', { ascending: false });
  if(error){
    $('list').innerHTML = '<div class="empty">Could not load messages. ' + esc(error.message) + '</div>';
    return;
  }
  msgs = data || [];
  render();
}

function render(){
  $('n-total').textContent = msgs.length;
  $('n-unread').textContent = msgs.filter(m => !m.is_read).length;
  const rows = msgs.filter(m => filter === 'all' || !m.is_read);
  if(!rows.length){ $('list').innerHTML = '<div class="empty">No messages here yet.</div>'; return; }
  $('list').innerHTML = rows.map(m => `
    <article class="msg ${m.is_read ? '' : 'unread'}">
      <div class="msg-top">
        <div><span class="msg-name">${esc(m.name)}</span>${m.is_read ? '' : '<span class="badge">NEW</span>'}
          <div class="msg-meta"><a href="mailto:${esc(m.email)}">${esc(m.email)}</a></div></div>
        <div class="msg-meta">${esc(fmt(m.created_at))}</div>
      </div>
      <div class="msg-body">${esc(m.message)}</div>
      <div class="msg-actions">
        <a class="btn sm" href="mailto:${esc(m.email)}?subject=Re: your message">Reply by email</a>
        ${m.is_read ? '' : '<button class="btn ghost sm" type="button" data-act="read" data-id="' + esc(m.id) + '">Mark read</button>'}
        <button class="btn danger sm" type="button" data-act="del" data-id="${esc(m.id)}">Delete</button>
      </div>
    </article>`).join('');
}

$('list').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if(!b) return;
  const id = b.dataset.id;
  if(b.dataset.act === 'read'){
    const { error } = await sb.from('messages').update({ is_read: true }).eq('id', id);
    if(!error){ msgs = msgs.map(m => String(m.id) === id ? { ...m, is_read: true } : m); render(); }
  } else if(b.dataset.act === 'del'){
    if(!confirm('Delete this message permanently?')) return;
    const { error } = await sb.from('messages').delete().eq('id', id);
    if(!error){ msgs = msgs.filter(m => String(m.id) !== id); render(); }
  }
});

(async () => {
  const { data } = await sb.auth.getSession();
  if(data.session){ show(true, data.session.user.email); load(); } else { show(false); }
})();
</script>
</body>
</html>
